name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara i file dell'app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png splash.png www/
      - run: npm install
      - run: npx cap add android
      - name: Permessi posizione
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Icona e schermata di avvio
        run: |
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png; do
              [ -f $R/mipmap-$d/$f ] && cp icon-512.png $R/mipmap-$d/$f || true
            done
            [ -f $R/mipmap-$d/ic_launcher_foreground.png ] && cp icon-fg.png $R/mipmap-$d/ic_launcher_foreground.png || true
          done
          sed -i 's/#FFFFFF/#0B1622/I' $R/values/ic_launcher_background.xml || true
          find $R -name 'splash.png' -exec cp splash.png {} \;
      - run: npx cap sync android
      - name: Compila APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Pubblica l'APK con un link fisso
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pioggia-live.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pioggia Live ${{ github.run_number }}
          files: pioggia-live.apk
          make_latest: true
